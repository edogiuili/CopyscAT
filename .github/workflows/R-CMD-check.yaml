# Runs R CMD check on the three major platforms.
# Bioconductor dependencies are installed alongside the CRAN ones.
on:
  push:
    branches: [main, master, dev-v1.0.0]
  pull_request:
    branches: [main, master, dev-v1.0.0]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # biomaRt / rtracklayer reach out to Ensembl and UCSC; the functions that
      # need them are not exercised by the test suite.
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          # Pull Bioconductor packages from the Bioc repositories.
          pak-version: stable

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          # Vignettes must be built here: --as-cran expects inst/doc to exist,
          # and --no-build-vignettes would leave it out.
          build_args: 'c("--no-manual")'
